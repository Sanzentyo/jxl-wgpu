[package]
name = "jxl_gpu_harness"
description = "Capture, replay, verification, benchmarking, and tuning harness for jxl_wgpu"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
rust-version.workspace = true
publish = false

[dependencies]
blake3 = "1.8.7"
bytemuck.workspace = true
clap = { version = "4.6.6", features = ["derive"] }
jxl_gpu_formats.workspace = true
jxl_gpu_protocol.workspace = true
jxl_wgpu.workspace = true
jxl_wgpu_decode.workspace = true
jxl_wgpu_encode.workspace = true
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.4"
wgpu = "30.0.1"

[lints]
workspace = true
