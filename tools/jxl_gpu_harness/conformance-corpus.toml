version = 1

# Executable GPU round-trip profile: lossless Gray U8, standard single- or multi-group framing.

[[cases]]
name = "singleton-gray8-1x1"
category = "tiny"
extent = { width = 1, height = 1 }
source = { model = "gray", depth = "u8", alpha = "none" }
row_layout = { alignment = 4, extra_padding = 3, padding_byte = 231 }
pattern = { seed = 17 }
expectation = "stock_gpu_round_trip"
support_note = "Minimum standard extent with non-zero row padding."
external_reference = true

