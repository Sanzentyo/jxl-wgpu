name: CI

on:
  pull_request:
    paths:
      - "crates/**"
      - "tools/**"
      - "fixtures/**"
      - "docs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          prefix-key: gpu-${{ matrix.os }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Build documentation
        run: cargo doc --workspace --no-deps

      - name: Check portable WebAssembly APIs
        run: >-
          cargo check --target wasm32-unknown-unknown
          -p jxl_gpu_bitstream -p jxl_gpu_protocol -p jxl_gpu_formats
          -p jxl_wgpu -p jxl_wgpu_decode -p jxl_wgpu_encode

      - name: Verify deterministic CPU reference corpus
        run: cargo run -p jxl_gpu_harness -- verify --backend reference

      - name: Verify Metal corpus
        if: runner.os == 'macOS'
        run: cargo run -p jxl_gpu_harness -- verify --backend wgpu

      - name: Verify indexed JPEG XL GPU decode with CPU readback on Metal
        if: runner.os == 'macOS'
        run: >-
          cargo run -p jxl_gpu_harness -- codec fixtures/gpu_gray8_lossless.jxl
          --format gray8 --output-target cpu-readback

  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install workspace MSRV
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.89.0

      - name: Check optional GPU crates on MSRV
        run: cargo check --workspace --all-targets
