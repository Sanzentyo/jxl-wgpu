[workspace]
members = [
  "crates/jxl_gpu_bitstream",
  "crates/jxl_gpu_protocol",
  "crates/jxl_gpu_formats",
  "crates/jxl_wgpu",
  "crates/jxl_wgpu_decode",
  "crates/jxl_wgpu_encode",
  "tools/jxl_gpu_harness",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "BSD-3-Clause"
rust-version = "1.89.0"

[workspace.dependencies]
jxl = { version = "=0.6.0", default-features = false }
jxl_gpu_bitstream = { path = "crates/jxl_gpu_bitstream", version = "=0.1.0" }
jxl_gpu_formats = { path = "crates/jxl_gpu_formats", version = "=0.1.0" }
jxl_gpu_protocol = { path = "crates/jxl_gpu_protocol", version = "=0.1.0" }
jxl_transforms = { version = "=0.6.0" }
jxl_wgpu = { path = "crates/jxl_wgpu", version = "=0.1.0" }
jxl_wgpu_decode = { path = "crates/jxl_wgpu_decode", version = "=0.1.0" }
jxl_wgpu_encode = { path = "crates/jxl_wgpu_encode", version = "=0.1.0" }
sha2 = { version = "0.11.0", default-features = false }

[workspace.lints.clippy]
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.dev]
debug-assertions = true
overflow-checks = true
opt-level = 1

[profile.release]
lto = "thin"
panic = "abort"

[profile.bench]
debug = true
