[package]
name = "jxl_wgpu"
description = "Portable wgpu acceleration backend for the jxl JPEG XL decoder"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
rust-version.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
jxl_gpu_protocol.workspace = true
jxl_gpu_formats.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.41"
wgpu = "30.0.1"

[dev-dependencies]
jxl.workspace = true
jxl_gpu_formats = { workspace = true, features = ["cpu-reference"] }
jxl_transforms.workspace = true
pollster = "1.0.1"

[lints]
workspace = true
