[package]
name = "jxl_wgpu"
description = "Portable wgpu execution, image output, display, and readback for GPU JPEG XL codecs"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
rust-version.workspace = true

[dependencies]
bytemuck.workspace = true
jxl_gpu_protocol.workspace = true
jxl_gpu_formats.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.41"
wgpu = "30.0.1"

[dev-dependencies]
jxl_gpu_formats = { workspace = true, features = ["cpu-reference"] }
jxl_transforms.workspace = true
naga = { version = "30.0.1", features = ["wgsl-in"] }
pollster = "1.0.1"

[lints]
workspace = true
